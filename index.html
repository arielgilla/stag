<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Tech - Hardware & Tecnología</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; color: #333; }
        header { background: #1a1a2e; color: white; padding: 25px; text-align: center; }
        .search-box { margin: 15px auto 0 auto; max-width: 500px; }
        .search-box input { width: 100%; padding: 12px; border-radius: 25px; border: none; font-size: 1rem; outline: none; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s; }
        .card:hover { transform: translateY(-4px); }
        .img-container { height: 180px; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; }
        .card img { max-height: 100%; max-width: 100%; object-fit: contain; }
        .card h3 { font-size: 0.95rem; margin-bottom: 10px; color: #1a1a2e; height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        .price { font-size: 1.3rem; font-weight: bold; color: #00a650; margin: 10px 0; }
        .btn-ws { background-color: #25d366; color: white; text-decoration: none; padding: 10px; text-align: center; border-radius: 5px; font-weight: bold; }
        .btn-ws:hover { background-color: #1eb854; }
        .loading { text-align: center; font-size: 1.2rem; margin: 50px; grid-column: 1 / -1; }
    </style>
</head>
<body>

<header>
    <h1>Mi Tienda Hardware & Tech</h1>
    <p>Envíos a todo el país | Productos actualizados</p>
    <div class="search-box">
        <input type="text" id="buscador" placeholder="Buscar producto, placa de video, procesador..." onkeyup="filtrarProductos()">
    </div>
</header>

<div class="container">
    <div id="catalogo" class="grid">
        <p class="loading">Cargando catálogo completo de productos...</p>
    </div>
</div>

<script>
    const TELEFONO_WHATSAPP = "5491100000000"; // Tu teléfono real de WhatsApp
    let listaProductos = [];

    fetch('productos.json')
        .then(response => response.json())
        .then(productos => {
            listaProductos = productos;
            renderProductos(listaProductos);
        })
        .catch(error => {
            document.getElementById('catalogo').innerHTML = '<p class="loading">Sincronizando inventario... Refresca la página en 1 minuto.</p>';
        });

    function renderProductos(items) {
        const contenedor = document.getElementById('catalogo');
        contenedor.innerHTML = '';

        if(!items || items.length === 0) {
            contenedor.innerHTML = '<p class="loading">No se encontraron productos.</p>';
            return;
        }

        items.forEach(p => {
            const mensaje = encodeURIComponent(`Hola! Quiero comprar: ${p.titulo} - Precio: $${p.precio_venta}`);
            const imgSrc = p.imagen || 'https://via.placeholder.com/200?text=Sin+Imagen';
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div class="img-container">
                    <img src="${imgSrc}" alt="${p.titulo}" onerror="this.src='https://via.placeholder.com/200?text=Imagen+No+Disponible'">
                </div>
                <h3>${p.titulo}</h3>
                <div class="price">$${p.precio_venta.toLocaleString('es-AR')}</div>
                <a href="https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}" target="_blank" class="btn-ws">Comprar por WhatsApp</a>
            `;
            contenedor.appendChild(card);
        });
    }

    function filtrarProductos() {
        const texto = document.getElementById('buscador').value.toLowerCase();
        const filtrados = listaProductos.filter(p => p.titulo.toLowerCase().includes(texto));
        renderProductos(filtrados);
    }
</script>

</body>
</html>
</script>

</body>
</html>
