<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAG - Soluciones Informáticas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --bg-card: #131b2e;
            --accent-cyan: #00d2ff;
            --accent-blue: #0072ff;
            --text-light: #e2e8f0;
            --text-silver: #a0aec0;
            --border-color: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); }

        /* Header & Logo */
        header { background: linear-gradient(180deg, #070a12 0%, #0d1527 100%); border-bottom: 2px solid var(--accent-cyan); padding: 15px 20px; }
        .header-container { max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; }
        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-container img { height: 60px; filter: drop-shadow(0 0 8px rgba(0,210,255,0.4)); }

        /* Buscador */
        .search-box { flex: 1; max-width: 500px; position: relative; }
        .search-box input { width: 100%; padding: 12px 20px; border-radius: 25px; border: 1px solid var(--accent-cyan); background: #070d1a; color: #fff; font-size: 0.95rem; outline: none; box-shadow: 0 0 10px rgba(0,210,255,0.1); }
        .search-box input:focus { box-shadow: 0 0 15px rgba(0,210,255,0.3); }

        /* Navegación Categorías */
        nav { background: #080d1a; border-bottom: 1px solid var(--border-color); overflow-x: auto; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; list-style: none; padding: 0 10px; }
        .nav-container li button { background: none; border: none; color: var(--text-silver); padding: 14px 20px; font-size: 0.9rem; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.3s; }
        .nav-container li button:hover, .nav-container li button.active { color: var(--accent-cyan); border-bottom: 3px solid var(--accent-cyan); background: rgba(0,210,255,0.05); }

        /* Grid de Productos */
        .container { max-width: 1200px; margin: 25px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; }
        .card { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border-color); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; transition: all 0.3s ease; }
        .card:hover { transform: translateY(-5px); border-color: var(--accent-cyan); box-shadow: 0 8px 20px rgba(0,210,255,0.15); }
        
        .img-container { height: 180px; display: flex; align-items: center; justify-content: center; background: #0a0f1d; border-radius: 8px; margin-bottom: 12px; padding: 10px; }
        .card img { max-height: 100%; max-width: 100%; object-fit: contain; }
        
        .cat-tag { font-size: 0.75rem; color: var(--accent-cyan); text-transform: uppercase; font-weight: bold; margin-bottom: 5px; }
        .card h3 { font-size: 0.9rem; color: var(--text-light); height: 2.8em; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-bottom: 10px; }
        .price { font-size: 1.4rem; font-weight: 800; color: #fff; text-shadow: 0 0 10px rgba(0,210,255,0.3); margin-bottom: 12px; }
        
        .btn-ws { background: linear-gradient(135deg, #00d2ff 0%, #0072ff 100%); color: #fff; text-decoration: none; padding: 10px; text-align: center; border-radius: 6px; font-weight: bold; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.3s; }
        .btn-ws:hover { opacity: 0.9; box-shadow: 0 0 12px rgba(0,210,255,0.4); }

        .loading { text-align: center; font-size: 1.2rem; color: var(--accent-cyan); margin: 50px 0; grid-column: 1 / -1; }
    </style>
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo-container">
            <img src="logo.png" alt="STAG Soluciones Informáticas" onerror="this.style.display='none'">
        </div>
        <div class="search-box">
            <input type="text" id="buscador" placeholder="Buscar procesador, placa de video, notebook..." onkeyup="filtrarProductos()">
        </div>
    </div>
</header>

<nav>
    <ul class="nav-container" id="menu-categorias">
        <li><button class="active" onclick="filtrarCategoria('Todas')">Todas las Categorías</button></li>
    </ul>
</nav>

<div class="container">
    <div id="catalogo" class="grid">
        <p class="loading"><i class="fas fa-spinner fa-spin"></i> Cargando catálogo STAG...</p>
    </div>
</div>

<script>
    const TELEFONO_WHATSAPP = "5493510000000"; // Reemplaza por tu número real de WhatsApp
    let listaProductos = [];
    let categoriaActual = 'Todas';

    // Catálogo con múltiples productos por categoría e imágenes CDN estables
    const catalogoBase = [
        // PROCESADORES
        { "titulo": "Procesador AMD Ryzen 5 5600GT 4.6GHz Turbo AM4", "precio_venta": 218500, "categoria": "Procesadores", "imagen": "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=400&q=80" },
        { "titulo": "Procesador AMD Ryzen 7 5700X3D 4.1GHz AM4", "precio_venta": 345000, "categoria": "Procesadores", "imagen": "https://images.unsplash.com/photo-1591799264318-7e6ef8ddb7ea?w=400&q=80" },
        { "titulo": "Procesador Intel Core i5 12400F 4.4GHz LGA1700", "precio_venta": 195000, "categoria": "Procesadores", "imagen": "https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=400&q=80" },
        { "titulo": "Procesador Intel Core i7 13700F 5.2GHz LGA1700", "precio_venta": 480000, "categoria": "Procesadores", "imagen": "https://images.unsplash.com/photo-1555680202-c86f0e12f086?w=400&q=80" },

        // PLACAS DE VIDEO
        { "titulo": "Placa de Video XFX Radeon RX 6600 8GB Speedster", "precio_venta": 391000, "categoria": "Placas de Video", "imagen": "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80" },
        { "titulo": "Placa de Video MSI GeForce RTX 3060 12GB Ventus 2X", "precio_venta": 520000, "categoria": "Placas de Video", "imagen": "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80" },
        { "titulo": "Placa de Video Palit GeForce RTX 4060 8GB Dual", "precio_venta": 485000, "categoria": "Placas de Video", "imagen": "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80" },
        { "titulo": "Placa de Video Asus TUF Gaming RTX 4070 Super 12GB", "precio_venta": 890000, "categoria": "Placas de Video", "imagen": "https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80" },

        // MEMORIAS RAM
        { "titulo": "Memoria RAM Kingston Fury Beast 16GB DDR4 3200MHz", "precio_venta": 59800, "categoria": "Memorias RAM", "imagen": "https://images.unsplash.com/photo-1562976540-1502c2145186?w=400&q=80" },
        { "titulo": "Memoria RAM Kingston Fury Beast 8GB DDR4 3200MHz", "precio_venta": 32000, "categoria": "Memorias RAM", "imagen": "https://images.unsplash.com/photo-1562976540-1502c2145186?w=400&q=80" },
        { "titulo": "Memoria RAM Corsair Vengeance 32GB (2x16GB) DDR5 6000MHz", "precio_venta": 165000, "categoria": "Memorias RAM", "imagen": "https://images.unsplash.com/photo-1562976540-1502c2145186?w=400&q=80" },

        // ALMACENAMIENTO
        { "titulo": "Disco Solido SSD Kingston NV2 1TB NVMe M.2", "precio_venta": 89000, "categoria": "Almacenamiento", "imagen": "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=400&q=80" },
        { "titulo": "Disco Solido SSD Kingston A400 480GB SATA3", "precio_venta": 45000, "categoria": "Almacenamiento", "imagen": "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=400&q=80" },
        { "titulo": "Disco Solido SSD WD Black SN770 2TB NVMe M.2", "precio_venta": 185000, "categoria": "Almacenamiento", "imagen": "https://images.unsplash.com/photo-1597872200969-2b65d56bd16b?w=400&q=80" },

        // NOTEBOOKS
        { "titulo": "Notebook Lenovo IdeaPad 15IAU7 Core i5 8GB 512GB SSD 15.6''", "precio_venta": 895000, "categoria": "Notebooks", "imagen": "https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=400&q=80" },
        { "titulo": "Notebook ASUS Vivobook Go 15 Ryzen 5 16GB 512GB SSD", "precio_venta": 790000, "categoria": "Notebooks", "imagen": "https://images.unsplash.com/photo-1603302576837-37561b2e2302?w=400&q=80" },

        // MONITORES
        { "titulo": "Monitor Gamer Samsung Odyssey G3 24'' 144Hz 1ms", "precio_venta": 275000, "categoria": "Monitores", "imagen": "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&q=80" },
        { "titulo": "Monitor LG 22'' Full HD 75Hz HDMI IPS", "precio_venta": 145000, "categoria": "Monitores", "imagen": "https://images.unsplash.com/photo-1527443224154-c4a3942d3acf?w=400&q=80" }
    ];

    fetch('productos.json')
        .then(res => res.json())
        .then(data => {
            if(Array.isArray(data) && data.length > 3) {
                listaProductos = data;
            } else {
                listaProductos = catalogoBase;
            }
            iniciar();
        })
        .catch(() => {
            listaProductos = catalogoBase;
            iniciar();
        });

    function iniciar() {
        construirMenuCategorias();
        renderProductos(listaProductos);
    }

    function construirMenuCategorias() {
        const categorias = ['Todas', ...new Set(listaProductos.map(p => p.categoria).filter(Boolean))];
        const menuNav = document.getElementById('menu-categorias');
        menuNav.innerHTML = '';

        categorias.forEach(cat => {
            const li = document.createElement('li');
            const btn = document.createElement('button');
            btn.innerText = cat;
            if(cat === 'Todas') btn.classList.add('active');
            btn.onclick = (e) => {
                document.querySelectorAll('.nav-container button').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                filtrarCategoria(cat);
            };
            li.appendChild(btn);
            menuNav.appendChild(li);
        });
    }

    function renderProductos(items) {
        const contenedor = document.getElementById('catalogo');
        contenedor.innerHTML = '';

        if(!items || items.length === 0) {
            contenedor.innerHTML = '<p class="loading">No hay productos en esta categoría.</p>';
            return;
        }

        items.forEach(p => {
            const mensaje = encodeURIComponent(`Hola STAG! Me interesa comprar: ${p.titulo} - Precio: $${p.precio_venta.toLocaleString('es-AR')}`);
            const imgSrc = p.imagen || 'https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80';
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <div>
                    <div class="img-container">
                        <img src="${imgSrc}" alt="${p.titulo}" onerror="this.src='https://images.unsplash.com/photo-1587202372775-e229f172b9d7?w=400&q=80'">
                    </div>
                    <div class="cat-tag">${p.categoria || 'Hardware'}</div>
                    <h3>${p.titulo}</h3>
                </div>
                <div>
                    <div class="price">$${p.precio_venta.toLocaleString('es-AR')}</div>
                    <a href="https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}" target="_blank" class="btn-ws">
                        <i class="fab fa-whatsapp"></i> Comprar
                    </a>
                </div>
            `;
            contenedor.appendChild(card);
        });
    }

    function filtrarCategoria(cat) {
        categoriaActual = cat;
        aplicarFiltros();
    }

    function filtrarProductos() {
        aplicarFiltros();
    }

    function aplicarFiltros() {
        const texto = document.getElementById('buscador').value.toLowerCase();
        let resultado = listaProductos;

        if (categoriaActual !== 'Todas') {
            resultado = resultado.filter(p => p.categoria === categoriaActual);
        }

        if (texto.trim() !== '') {
            resultado = resultado.filter(p => p.titulo.toLowerCase().includes(texto));
        }

        renderProductos(resultado);
    }
</script>

</body>
</html>
