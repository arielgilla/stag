<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Tienda Tech - Catálogo en Vivo</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f8; color: #333; }
        header { background: #1a1a2e; color: white; padding: 20px; text-align: center; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 8px; padding: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; justify-content: space-between; }
        .card h3 { font-size: 1rem; margin-bottom: 10px; color: #1a1a2e; }
        .price { font-size: 1.3rem; font-weight: bold; color: #25d366; margin: 10px 0; }
        .btn-ws { background-color: #25d366; color: white; text-decoration: none; padding: 10px; text-align: center; border-radius: 5px; font-weight: bold; }
        .btn-ws:hover { background-color: #1eb854; }
        .loading { text-align: center; font-size: 1.2rem; margin: 50px; }
    </style>
</head>
<body>

<header>
    <h1>Mi Tienda Hardware & Tech</h1>
    <p>Envíos a todo el país | Productos en stock actualizados</p>
</header>

<div class="container">
    <div id="catalogo" class="grid">
        <p class="loading">Cargando productos actualizados...</p>
    </div>
</div>

<script>
    // Cambia este número por tu número de teléfono real con código de país (Ej: 5493510000000 para Argentina)
    const TELEFONO_WHATSAPP = "5491100000000"; 

    fetch('productos.json')
        .then(response => response.json())
        .then(productos => {
            const contenedor = document.getElementById('catalogo');
            contenedor.innerHTML = '';

            if(productos.length === 0) {
                contenedor.innerHTML = '<p>No hay productos disponibles por el momento.</p>';
                return;
            }

            productos.forEach(p => {
                const mensaje = encodeURIComponent(`Hola! Quiero consultar/comprar este producto: ${p.titulo} - Precio: $${p.precio_venta}`);
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <h3>${p.titulo}</h3>
                    <div class="price">$${p.precio_venta.toLocaleString('es-AR')}</div>
                    <a href="https://wa.me/${TELEFONO_WHATSAPP}?text=${mensaje}" target="_blank" class="btn-ws">Comprar por WhatsApp</a>
                `;
                contenedor.appendChild(card);
            });
        })
        .catch(error => {
            document.getElementById('catalogo').innerHTML = '<p>Sincronizando tienda con el inventario... Refresca la página en 1 minuto.</p>';
        });
</script>

</body>
</html>
