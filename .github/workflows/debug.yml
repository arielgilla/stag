name: Debug Venex HTML

on:
  workflow_dispatch:  # lo podés lanzar manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  debug-html:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium chromedriver-autoinstaller

      - name: Ejecutar scraper debug
        run: python scraper_debug.py

      - name: Commit y push del HTML
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_pagina.html
          git commit -m "Debug HTML Venex [skip ci]" || echo "No hay cambios"
          git pull --rebase origin main
          git push
