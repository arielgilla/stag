name: Actualizar Catálogo Venex

on:
  schedule:
    - cron: '0 8 * * *' # Se ejecuta todos los días a las 08:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright beautifulsoup4
          playwright install chromium

      - name: Ejecutar scraper
        run: python scraper.py

      - name: Commit y push de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          git commit -m "Sincronización automática de catálogo y stock [skip ci]" || echo "No hay cambios nuevos en el catálogo"
          git pull --rebase origin main
          git push
