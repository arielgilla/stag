name: Scraper Venex Productos

on:
  workflow_dispatch:   # lo lanzás manualmente desde la pestaña Actions
  schedule:
    - cron: "0 3 * * *"   # opcional: corre todos los días a las 3 AM

permissions:
  contents: write

jobs:
  scrape-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Ejecutar scraper_final
        run: python scraper_final.py

      - name: Commit y push de productos.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          git commit -m "Actualización automática de productos con margen [skip ci]" || echo "No hay cambios"
          git pull --rebase origin main
          git push
