name: Sincronizador Automático de Venex

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías de extracción
        run: pip install beautifulsoup4

      - name: Ejecutar Scraper
        run: python scraper.py

      - name: Actualizar tienda con los nuevos precios/stock
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add productos.json
          git commit -m "Actualización automática de precios y stock desde Venex" || echo "Sin cambios"
          git push
