name: Actualizar Catálogo Venex

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Instalar Chrome y Chromedriver correctos
        run: |
          sudo apt-get update || true
          sudo apt-get install -y wget unzip || true
          sudo apt-get install -y google-chrome-stable || true
          CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
          CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)
          DRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_MAJOR}")
          wget -q "https://chromedriver.storage.googleapis.com/${DRIVER_VERSION}/chromedriver_linux64.zip" -O /tmp/chromedriver.zip
          unzip -o /tmp/chromedriver.zip -d /tmp/
          sudo mv -f /tmp/chromedriver /usr/local/bin/chromedriver

      - name: Ejecutar scraper con undetected-chromedriver
        run: python scraper.py

      - name: Debug productos.json
        run: |
          echo "Contenido de productos.json:"
          head -n 50 productos.json

      - name: Commit y push de cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          git commit -m "Sincronización automática de catálogo y stock [skip ci]" || echo "No hay cambios nuevos en el catálogo"
          git pull --rebase origin main
          git push
