name: Debug Venex Requests

on:
  workflow_dispatch:  # lo lanzás manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  debug-requests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium-wire chromedriver-autoinstaller

      - name: Ejecutar scraper_debug_wire
        run: python scraper_debug_wire.py

      - name: Commit y push de debug_requests.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add debug_requests.txt
          git commit -m "Debug requests Venex [skip ci]" || echo "No hay cambios"
          git pull --rebase origin main
          git push
