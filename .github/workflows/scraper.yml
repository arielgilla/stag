name: Actualizar productos

on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 UTC = 5:00 AM Argentina
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install selenium pandas

      - name: Ejecutar scraper
        run: |
          python scraper_final.py   # 🔹 usa el nombre del script actualizado

      - name: Subir productos.csv a DonWeb por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: c2871523.ferozo.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps          # 🔹 fuerza FTPS (TLS)
          port: 21                # 🔹 puerto estándar de FTP/FTPS
          local-dir: ./           # 🔹 carpeta local del repo
          server-dir: /public_html/
          exclude: |
            **/*
            !productos.csv         # 🔹 solo sube productos.csv
