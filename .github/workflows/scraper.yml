name: Actualizar productos

on:
  schedule:
    - cron: '0 8 * * *'   # 8:00 UTC = 5:00 AM Argentina
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar Chrome y ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          install-chromedriver: true

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium pandas

      - name: Ejecutar scraper
        run: python scraper_final.py

      - name: Verificar productos.csv
        run: |
          python -c "import pandas as pd; df = pd.read_csv('dist/productos.csv'); assert not df.empty, 'El CSV no tiene productos'; print(f'Productos encontrados: {len(df)}')"
          ls -lh dist/productos.csv

      - name: Subir productos.csv a DonWeb por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: c2871523.ferozo.com
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
