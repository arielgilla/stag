name: Actualizar productos

on:
  schedule:
    - cron: '0 8 * * *'   # Ejecuta todos los días a las 5 AM hora Argentina (UTC+0 +3h)
  workflow_dispatch:       # Permite ejecutarlo manualmente también

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install selenium pandas

      - name: Ejecutar scraper
        run: |
          python scraper_final.py

      - name: Commit y push productos.csv
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.csv
          git commit -m "Actualización automática de productos [skip ci]" || echo "No hay cambios"
          git pull origin main --rebase
          git push origin main

      - name: Guardar productos_sitiosimple.xlsx como artifact
        uses: actions/upload-artifact@v4
        with:
          name: productos-sitiosimple
          path: productos_sitiosimple.xlsx
