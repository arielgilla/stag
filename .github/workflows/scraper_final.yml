name: Scraper Venex Productos

on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"   # todos los días a las 7 AM UTC (4 AM Argentina)

permissions:
  contents: write

jobs:
  scrape-products:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Instalar Chromium y Chromedriver
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Ejecutar scraper_final
        env:
          CHROME_BIN: /usr/bin/chromium-browser
          CHROMEDRIVER_PATH: /usr/bin/chromedriver
        run: python scraper_final.py

      - name: Commit y push de productos.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          git commit -m "Actualización automática de productos con margen [skip ci]" || echo "No hay cambios"
          git push origin main

      - name: Guardar productos.json como artifact
        uses: actions/upload-artifact@v4
        with:
          name: productos-json
          path: productos.json

      # 🔹 convertir JSON a CSV
      - name: Convertir JSON a CSV
        run: python convertir_json_csv.py

      - name: Guardar productos_sitiosimple.csv como artifact
        uses: actions/upload-artifact@v4
        with:
          name: productos-sitiosimple
          path: productos_sitiosimple.csv

      # 🔹 OPCIONAL: publicar CSV en GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v3

      - name: Subir CSV a Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: scrape-products
    steps:
      - name: Deploy a GitHub Pages
        uses: actions/deploy-pages@v2
