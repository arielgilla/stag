name: Probar API Venex

on:
  workflow_dispatch:  # lo lanzás manualmente desde la pestaña Actions

permissions:
  contents: write

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Ejecutar test_api.py
        run: python test_api.py

      - name: Guardar salida en archivo
        run: |
          python test_api.py > api_resultados.txt
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add api_resultados.txt
          git commit -m "Resultados de prueba API Venex [skip ci]" || echo "No hay cambios"
          git pull --rebase origin main
          git push
